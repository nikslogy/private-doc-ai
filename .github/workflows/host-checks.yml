name: Host checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: host-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Use runner JDK 21
        run: |
          test -x "$JAVA_HOME_21_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - name: Restore Gradle dependency and task caches
        id: gradle-cache
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            .tooling/gradle-user-home/caches
            .tooling/gradle-user-home/wrapper
          key: gradle-v1-${{ runner.os }}-${{ runner.arch }}-jdk21-${{ hashFiles('build.gradle.kts', 'settings.gradle.kts', 'app/build.gradle.kts', 'core/build.gradle.kts', 'platform/build.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties', 'config/toolchain.json') }}-${{ github.sha }}
          restore-keys: |
            gradle-v1-${{ runner.os }}-${{ runner.arch }}-jdk21-${{ hashFiles('build.gradle.kts', 'settings.gradle.kts', 'app/build.gradle.kts', 'core/build.gradle.kts', 'platform/build.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties', 'config/toolchain.json') }}-
            gradle-v1-${{ runner.os }}-${{ runner.arch }}-jdk21-
      - name: Set up pinned Android and Gradle tools
        # Dependency/task caches exclude Android user homes and all signing keys.
        # The two narrow paths are restored by the preceding pinned cache action.
        run: scripts/bootstrap-android.sh --accept-sdk-licenses
      - name: Run host validation and stage verified development APKs
        run: |
          source .tooling/env.sh
          python3 scripts/stage-apks.py
      - name: Save verified host Gradle caches
        if: ${{ success() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/android16-vault-unlock' || github.ref == 'refs/heads/feat/offline-ocr') && steps.gradle-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            .tooling/gradle-user-home/caches
            .tooling/gradle-user-home/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
      - name: Enable KVM for the ephemeral Android regression target
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-private-assistant-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify stable preview build configuration using a disposable identity
        run: scripts/check-stable-signing-build.sh
      - name: Run non-skipped Android 16 vault regressions
        run: scripts/run-ci-unlock-emulator.sh
      - name: Upload synthetic Android regression reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vault-unlock-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/unlock-regression/
            platform/build/outputs/androidTest-results/
            platform/build/reports/androidTests/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload both APKs, checksums and public build reports
        if: ${{ success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: private-document-assistant-debug-apks-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/apk/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          include-hidden-files: false
