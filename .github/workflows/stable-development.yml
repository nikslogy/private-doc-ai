name: Stable development APKs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [config/development-delivery.json]
permissions:
  contents: read
concurrency:
  group: stable-development-apks
  cancel-in-progress: false
jobs:
  build:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Use runner JDK 21
        run: |
          test -x "$JAVA_HOME_21_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - name: Set up pinned Android and Gradle tools
        run: scripts/bootstrap-android.sh --accept-sdk-licenses
      - name: Enable KVM for the disposable Android regression target
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-private-assistant-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify stable signing, build both APKs and run Android regressions
        env:
          ANDROID_DEV_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEV_KEYSTORE_BASE64 }}
          ANDROID_DEV_STORE_PASSWORD: ${{ secrets.ANDROID_DEV_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          signing_directory="$(mktemp -d "$RUNNER_TEMP/private-assistant-signing.XXXXXX")"
          trap 'rm -rf -- "$signing_directory"' EXIT
          chmod 700 "$signing_directory"
          export ANDROID_DEV_KEYSTORE_PATH="$signing_directory/development.p12"
          python3 scripts/prepare-development-signing.py
          unset ANDROID_DEV_KEYSTORE_BASE64
          source .tooling/env.sh
          export ORG_GRADLE_PROJECT_stableDevelopment=true
          python3 scripts/stage-apks.py
          scripts/run-ci-unlock-emulator.sh
      - name: Upload Android regression reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stable-android-regressions-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/unlock-regression/
            platform/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload APKs signed by the pinned development identity
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: private-document-assistant-stable-apks-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/apk/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
